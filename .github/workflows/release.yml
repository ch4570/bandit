name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,pathlib; expected='v'+pathlib.Path('VERSION').read_text().strip(); assert os.environ['RELEASE_TAG']==expected, f'Tag must be {expected}'"
      - name: Validate distribution
        run: python -B scripts/validate.py
      - name: Run installer and archive tests
        run: python -B -m unittest discover -s tests -v
      - name: Build archive and checksums
        run: python -B scripts/build_bundle.py
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/SHA256SUMS.txt --verify-tag --title "PM Craft $RELEASE_TAG" --generate-notes
