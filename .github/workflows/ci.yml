name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure and references
        run: python -B scripts/validate.py
      - name: Installer, archive, and validation tests
        run: python -B -m unittest discover -s tests -v
      - name: Build reproducible distribution
        run: python -B scripts/build_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: pm-craft-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*

