name: Bug or incorrect behavior
description: Report an installation problem or a reproducible product-planning failure.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "English and Korean are welcome. Use fictional or sanitized inputs; omit secrets and private customer information."
  - type: input
    id: version
    attributes:
      label: BANDIT version
      placeholder: "Release version or commit SHA"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and stage
      description: "What were you trying to accomplish? Name the skill command and relevant stage: research, product planning, marketing planning, design handoff, business-model planning, or installation."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "For installation: OS, Node.js and npm versions, and command. For behavior: host, model if known, and how the skill was loaded."
  - type: textarea
    id: reproduction
    attributes:
      label: Request and reproduction
      description: "Include the smallest input or steps that reproduce the problem."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed gap and raw evidence
      description: "Paste or link the actual output or logs for the version above. Explain the failure, separating observed results from your interpretation. Preserve failed output."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and acceptance criteria
      description: "Name the product rule or installer behavior that should hold and how a reviewer can tell the fix works."
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change and alternatives
      description: "Optional: suggest a fix or workaround and explain its trade-offs. A diagnosis is not required to report a bug."
  - type: textarea
    id: validation
    attributes:
      label: Validation and limits
      description: "List checks actually run with results, then planned checks and known limits. If none were run beyond the reproduction, say so."
  - type: textarea
    id: related
    attributes:
      label: Related issue and branches
      description: "Optional: link related issues or PRs and give the proposed base and head branch if work has started."
